<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dedicapag - Un mensaje para mi princesa 💖</title>
    
    <!-- Fuentes oficiales de la plataforma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: #fff0f3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo de corazones flotantes */
        .bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart-item {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 75, 110, 0.18);
            font-size: 24px;
            animation: driftUp 12s infinite linear;
        }

        @keyframes driftUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-105vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* Contenedor e interfaz principal */
        .wrapper {
            width: 100%;
            max-width: 420px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-card {
            background: #ffffff;
            border-radius: 30px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 75, 110, 0.08);
            border: 1px solid rgba(255, 75, 110, 0.05);
            position: relative;
        }

        /* Foto de cabecera con tu imagen de WhatsApp */
        .photo-container {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
        }

        .photo-main {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 24px rgba(255, 75, 110, 0.18);
        }

        .mini-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #ff4b6e;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(255, 75, 110, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .author-text {
            font-size: 0.85rem;
            color: #718096;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        /* Botón del sobre */
        .envelope-btn {
            background: #ff4b6e;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.35);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 85%;
            justify-content: center;
        }

        .envelope-btn:hover {
            background: #ff3358;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 75, 110, 0.45);
        }

        /* Caja de la carta */
        .letter-area {
            display: none;
            background: #fffafb;
            border-radius: 20px;
            padding: 24px;
            text-align: left;
            border: 1px dashed #ffccd5;
            margin-top: 10px;
        }

        .letter-body {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #4a5568;
            white-space: pre-wrap;
            font-weight: 600;
        }

        /* Cursor animado de escritura */
        .letter-body::after {
            content: "✍️";
            animation: blink 0.8s infinite;
            font-size: 1.1rem;
            margin-left: 4px;
        }

        .letter-body.done::after {
            display: none;
        }

        .letter-sign {
            font-family: 'Caveat', cursive;
            font-size: 2.3rem;
            color: #ff4b6e;
            margin-top: 20px;
            text-align: right;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* Reproductor de música */
        .music-player {
            margin-top: 28px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #f7fafc;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
        }

        .play-btn {
            background: #ff4b6e;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .play-btn:hover {
            background: #ff3358;
        }

        .music-info {
            text-align: left;
        }

        .music-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #4a5568;
            display: block;
        }

        .music-sub {
            font-size: 0.7rem;
            color: #a0aec0;
            font-weight: 600;
        }

        .brand-footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #a0aec0;
            font-weight: 600;
        }

        .brand-footer span {
            color: #ff4b6e;
        }
    </style>
</head>
<body>

    <!-- Corazones en el fondo -->
    <div class="bg-hearts" id="heartsGrid"></div>

    <div class="wrapper">
        <div class="main-card">
            
            <!-- Tu Foto de WhatsApp -->
            <div class="photo-container">
                <img src="WhatsApp Image 2026-05-29 at 2.26.17 PM (1).jpeg" alt="Nosotros" class="photo-main">
                <div class="mini-badge">👑</div>
            </div>

            <!-- Cabeceras -->
            <h1>Te dejaron una dedicatoria</h1>
            <div class="author-text">De: Tu novio hermoso</div>

            <!-- Botón Inicial -->
            <div id="triggerZone">
                <button class="envelope-btn" onclick="openEnvelope()">
                    ✉️ Ver mensaje completo
                </button>
            </div>

            <!-- Carta Dinámica -->
            <div class="letter-area" id="boxLetter">
                <div class="letter-body" id="textTarget"></div>
                <div class="letter-sign" id="signatureTarget">Te amo muchísimo <3</div>
            </div>

            <!-- Reproductor visual -->
            <div class="music-player">
                <div class="play-btn" onclick="toggleAudio()" id="audioAction">▶</div>
                <div class="music-info">
                    <span class="music-title">Mariposa - Enanitos Verdes 🦋</span>
                    <span class="music-sub" id="audioState">Pausado</span>
                </div>
            </div>

            <!-- AQUÍ SE LLAMA A TU CANCIÓN LOCAL DIRECTAMENTE -->
            <audio id="romanticSong" src="mariposa.mp3" loop></audio>

        </div>

        <div class="brand-footer">
            Generado en <span>Dedicapag</span>
        </div>
    </div>

    <script>
        // Tu hermosa carta
        const fullText = `Mi amorr en esta carta te quiero decir que estoy muy feliz por ti, por lograr un objetivo más, sé que no fue fácil y piensas que no valio la pena pero vamos que si se puede, yo estare aqui para apoyarte siempre. te amo muchoo mi princesa y siempre reucerda que tienes a personas a que les preocupa que estes mal; y puedes decirnos cualquier cosa.\n\nFELICIDADES BBITA, lo lograste espero que te vaye bien en todo, este cargo no lo veas como una responsabilidad mas sé que lo es, pero vealo como una distraccion, no te estreses y bueno vamos mi amor a seguir cumpliendo más metas te amo muchisimo, muchos beshitos para ti.\n\nSé que no estoy ahi presente pero cuando nos veamos te hare sentir la persona más feliz, beshitos mi niña hermosa, gracias por compartir tú vida conmigo <33`;

        // Generador de corazones de fondo
        const grid = document.getElementById('heartsGrid');
        const heartIcons = ['❤️', '💖', '💕', '✨'];
        for (let i = 0; i < 12; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart-item');
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 8 + 's';
            heart.style.animationDuration = Math.random() * 5 + 8 + 's';
            heart.style.fontSize = Math.random() * 12 + 16 + 'px';
            grid.appendChild(heart);
        }

        const song = document.getElementById('romanticSong');
        const actionBtn = document.getElementById('audioAction');
        const stateTxt = document.getElementById('audioState');

        // Función al abrir el sobre
        function openEnvelope() {
            document.getElementById('boxLetter').style.display = 'block';
            document.getElementById('triggerZone').style.display = 'none';
            
            // Iniciar la reproducción de tu música
            song.play().then(() => {
                actionBtn.innerText = "⏸";
                stateTxt.innerText = "Reproduciendo";
            }).catch((err) => {
                console.log("El navegador bloqueó el autoplay. Se reproducirá al interactuar.");
            });

            // Iniciar efecto máquina de escribir
            startTypingEffect();
        }

        // Escritura progresiva
        function startTypingEffect() {
            const target = document.getElementById('textTarget');
            const signature = document.getElementById('signatureTarget');
            let index = 0;

            function type() {
                if (index < fullText.length) {
                    target.innerHTML += fullText.charAt(index);
                    index++;
                    setTimeout(type, 45); 
                } else {
                    target.classList.add('done');
                    signature.style.opacity = '1';
                }
            }
            type();
        }

        // Interruptor manual de audio
        function toggleAudio() {
            if (song.paused) {
                song.play();
                actionBtn.innerText = "⏸";
                stateTxt.innerText = "Reproduciendo";
            } else {
                song.pause();
                actionBtn.innerText = "▶";
                stateTxt.innerText = "Pausado";
            }
        }
    </script>
</body>
</html>
